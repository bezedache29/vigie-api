openapi: 3.0.3
info:
  title: Vigie API
  version: 1.0.0
  description: >
    API backend de Vigie, l'agent IA qui surveille le web, YouTube et Reddit
    pour livrer l'essentiel de la tech, résumé et trié.

servers:
  - url: https://{domain}/api
    description: Local dev via Traefik (Sail)
    variables:
      domain:
        default: vigie-api.dev.localhost
        description: Valeur de APP_DOMAIN dans .env

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Authentification (login/logout, Bearer token)
  - name: Sources
    description: Sources surveillées (RSS, YouTube, Reddit...)
  - name: Items
    description: Contenus collectés depuis les sources
  - name: Summaries
    description: Résumés IA des items (lecture seule)
  - name: Digests
    description: Historique des digests envoyés (lecture seule)
  - name: Preferences
    description: Préférences de l'utilisateur (mots-clés, fréquence, sources activées)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token Sanctum (Authorization Bearer), obtenu via POST /login

  schemas:
    Source:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Hacker News"
        type:
          type: string
          enum: [rss, youtube, twitter, reddit, web_search]
        url_or_query:
          type: string
          example: "https://news.ycombinator.com/rss"
        config:
          type: object
          nullable: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SourceInput:
      type: object
      required: [name, type, url_or_query]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [rss, youtube, twitter, reddit, web_search]
        url_or_query:
          type: string
        config:
          type: object
          nullable: true
        is_active:
          type: boolean

    Item:
      type: object
      properties:
        id:
          type: integer
        source_id:
          type: integer
        title:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
        raw_content:
          type: string
          nullable: true
        published_at:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [pending, summarized, ignored, error]
        summary:
          $ref: '#/components/schemas/Summary'
        created_at:
          type: string
          format: date-time

    Summary:
      type: object
      properties:
        id:
          type: integer
        item_id:
          type: integer
        summary_text:
          type: string
        tags:
          type: array
          items:
            type: string
        relevance_score:
          type: integer
          minimum: 0
          maximum: 100
        model_used:
          type: string
        created_at:
          type: string
          format: date-time

    Digest:
      type: object
      properties:
        id:
          type: integer
        item_ids:
          type: array
          items:
            type: integer
        channel:
          type: string
          enum: [email, dashboard]
        sent_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    UserPreference:
      type: object
      properties:
        keywords:
          type: array
          items:
            type: string
          nullable: true
        digest_frequency:
          type: string
          enum: [daily, weekly]
        active_source_ids:
          type: array
          items:
            type: integer

    Error:
      type: object
      properties:
        message:
          type: string

  responses:
    Unauthorized:
      description: Non authentifié
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Erreur de validation
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
              errors:
                type: object

paths:
  /login:
    post:
      tags: [Auth]
      summary: Authentification
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, device_name]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                device_name:
                  type: string
                  example: "iphone-de-chris"
      responses:
        '200':
          description: Token émis
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        '422':
          $ref: '#/components/responses/ValidationError'

  /logout:
    post:
      tags: [Auth]
      summary: Révoque le token courant
      responses:
        '204':
          description: Déconnecté
        '401':
          $ref: '#/components/responses/Unauthorized'

  /user:
    get:
      tags: [Auth]
      summary: Utilisateur authentifié
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'

  /sources:
    get:
      tags: [Sources]
      summary: Liste des sources
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Source'
    post:
      tags: [Sources]
      summary: Crée une source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceInput'
      responses:
        '201':
          description: Créée
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Source'
        '422':
          $ref: '#/components/responses/ValidationError'

  /sources/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Sources]
      summary: Détail d'une source
      responses:
        '200':
          description: OK
    put:
      tags: [Sources]
      summary: Met à jour une source
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceInput'
      responses:
        '200':
          description: OK
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Sources]
      summary: Supprime une source
      responses:
        '204':
          description: Supprimée

  /items:
    get:
      tags: [Items]
      summary: Liste des items collectés (paginée, plus récents en premier)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Item'

  /items/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Items]
      summary: Détail d'un item (avec son résumé s'il existe)
      responses:
        '200':
          description: OK
    put:
      tags: [Items]
      summary: Bascule manuelle du statut (pending ↔ ignored uniquement)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [pending, ignored]
      responses:
        '200':
          description: OK
        '422':
          $ref: '#/components/responses/ValidationError'

  /summaries:
    get:
      tags: [Summaries]
      summary: Liste des résumés (lecture seule)
      responses:
        '200':
          description: OK

  /summaries/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Summaries]
      summary: Détail d'un résumé
      responses:
        '200':
          description: OK

  /digests:
    get:
      tags: [Digests]
      summary: Historique des digests envoyés (lecture seule)
      responses:
        '200':
          description: OK

  /digests/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Digests]
      summary: Détail d'un digest
      responses:
        '200':
          description: OK

  /preferences:
    get:
      tags: [Preferences]
      summary: Préférences de l'utilisateur authentifié (créées à la volée si absentes)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UserPreference'
    put:
      tags: [Preferences]
      summary: Met à jour les préférences (mots-clés, fréquence, sources activées)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                keywords:
                  type: array
                  items:
                    type: string
                digest_frequency:
                  type: string
                  enum: [daily, weekly]
                source_ids:
                  type: array
                  items:
                    type: integer
                  description: Remplace la liste des sources activées pour cet utilisateur
      responses:
        '200':
          description: OK
        '422':
          $ref: '#/components/responses/ValidationError'
